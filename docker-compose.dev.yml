# The three data stores, and nothing else.
#
#   docker compose -f docker-compose.dev.yml up -d
#   cargo run --manifest-path apps/backend/Cargo.toml -p micaforge-server
#   pnpm dev
#
# For working on Micaforge, not for running it. The server and the web app run
# on the host from source, so a save is a restart and not an image build.
#
# Everything is published on 127.0.0.1 on purpose. These containers have
# development passwords in a file that is committed to the repository, which is
# safe exactly as long as nothing outside this machine can open the port. Do not
# change the bindings to 0.0.0.0, and do not use this file on a server.
#
# The project name keeps these volumes separate from the production stack's, so
# `docker compose down -v` on one cannot take the other's data with it.

name: micaforge-dev

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-micaforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-micaforge_dev}
      POSTGRES_DB: ${POSTGRES_DB:-micaforge}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest-alpine}
    restart: unless-stopped
    ports:
      # 8123 is the HTTP interface the server uses. 9000 is the native
      # protocol, which is what `clickhouse-client` on your host connects to;
      # it is published because reading the raw tables is half of debugging a
      # query.
      - "127.0.0.1:${DEV_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${DEV_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-micaforge}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-micaforge}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-micaforge_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # The same overrides production runs. A memory limit that only exists in
      # production is a memory limit you meet for the first time in production.
      - ./infra/clickhouse/config.xml:/etc/clickhouse-server/config.d/micaforge.xml:ro
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/micaforge.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:8-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_VALKEY_PORT:-6379}:6379"
    # No persistence here. A cold Valkey costs a new daily visitor salt and a
    # reset live counter, which in development is a feature: it is the fastest
    # way to test what a fresh install does.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
