# Micaforge release.
#
# Push a tag named v<version> (v0.1.0) and this publishes:
#
#   ghcr.io/<owner>/micaforge:<version>       the server, with the tracker in it
#   ghcr.io/<owner>/micaforge-web:<version>   Caddy with the built web app
#   @micaforge/sdk, @micaforge/sdk-server      on npm, with provenance
#   a GitHub release with generated notes
#
# Both images are built for amd64 and arm64, each on a native runner: the server
# is a Rust release build with LTO, and under QEMU emulation that takes hours.
#
# The tag must match the version in every manifest, or nothing is published. A
# release whose image says one version and whose tracker says another is worse
# than no release.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------
  check:
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Compare the tag with every manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          fail=0
          for manifest in package.json apps/web/package.json packages/sdk/package.json packages/sdk-server/package.json; do
            found=$(node -p "require('./$manifest').version || ''")
            if [ -n "$found" ] && [ "$found" != "$version" ]; then
              echo "::error file=$manifest::version is $found, the tag says $version"
              fail=1
            fi
          done
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' apps/backend/Cargo.toml)
          if [ "$cargo_version" != "$version" ]; then
            echo "::error file=apps/backend/Cargo.toml::workspace version is $cargo_version, the tag says $version"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # Image names must be lower case; an owner name need not be.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  images:
    name: ${{ matrix.target }} image (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [server, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - target: server
            image: micaforge
          - target: web
            image: micaforge-web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only. The tags are written once, by the merge job,
      # after both architectures exist, so no tag ever points at half a release.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.check.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------
  manifests:
    name: ${{ matrix.image }} manifest
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: server
            image: micaforge
          - target: web
            image: micaforge-web
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release (v0.2.0-rc.1) gets its own tag and never moves `latest`.
      - name: Tag both architectures under one name
        working-directory: /tmp/digests
        run: |
          name="${{ env.REGISTRY }}/${{ needs.check.outputs.owner }}/${{ matrix.image }}"
          version="${{ needs.check.outputs.version }}"
          tags=(-t "$name:$version")
          case "$version" in
            *-*) ;;
            *)
              minor="${version%.*}"
              tags+=(-t "$name:$minor" -t "$name:latest")
              ;;
          esac
          sources=()
          for digest in *; do sources+=("$name@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$name:$version"

  # ---------------------------------------------------------------------
  npm:
    name: npm packages
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Built and tested again here, not trusted from CI: what is published is
      # what this job built.
      - name: Build and test
        run: |
          pnpm --filter @micaforge/sdk build
          pnpm --filter @micaforge/sdk test
          pnpm --filter @micaforge/sdk-server build
          pnpm --filter @micaforge/sdk-server test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.check.outputs.version }}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          for pkg in packages/sdk packages/sdk-server; do
            (cd "$pkg" && npm publish --provenance --access public --tag "$tag")
          done

  # ---------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [check, manifests, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.check.outputs.version }}"
          owner="${{ needs.check.outputs.owner }}"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          cat >/tmp/notes.md <<NOTES
          Images:

              ghcr.io/$owner/micaforge:$version
              ghcr.io/$owner/micaforge-web:$version

          Install or move an existing install to this release:

              ./install.sh --version $version

          NOTES
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" \
            --title "Micaforge $version" \
            --notes-file /tmp/notes.md \
            --generate-notes
