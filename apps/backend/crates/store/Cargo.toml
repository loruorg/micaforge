[package]
name = "micaforge-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Postgres, ClickHouse and Redis access for Micaforge."

[lib]
name = "micaforge_store"
path = "src/lib.rs"

[dependencies]
micaforge-core = { workspace = true }

# Postgres. `macros` is added on top of the workspace feature set for exactly
# two things: `sqlx::migrate!`, which embeds `apps/backend/migrations` into the
# binary so a self-hoster never ships a loose SQL directory, and the `FromRow`
# derive. Every *query* in this crate is runtime-checked `query`/`query_as`, so
# the build still never needs a live database or an offline cache.
sqlx = { workspace = true, features = ["macros"] }

clickhouse = { workspace = true }
redis = { workspace = true }

tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

tracing = { workspace = true }
