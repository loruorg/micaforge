[package]
name = "micaforge-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The AI analyst for Micaforge: an OpenAI-compatible model client, the tool registry over the query engine, and the bounded tool-calling loop."
build = "build.rs"

[lib]
name = "micaforge_ai"
path = "src/lib.rs"

[dependencies]
micaforge-core = { workspace = true }
# Postgres for the tools that read configuration (goals, funnels, annotations),
# ClickHouse for every report, both through the same handles the server uses.
micaforge-store = { workspace = true }
# Every analytics number the model sees comes from the query engine's own
# reports, never from SQL written here: one definition of each metric.
micaforge-query = { workspace = true }

# The model is reached over HTTP. A client of its own rather than the worker's
# guarded one: the model's address is the operator's configuration, often a
# server on the same private network, which the guarded resolver refuses on
# purpose for addresses that users type.
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# `Tool` is used as `Box<dyn Tool>`, and an async method on a trait object
# still needs the boxed future this macro writes.
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
# The equivalent stats request each tool reports is a query string, encoded.
url = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The tool-calling loop is tested against a real HTTP server started inside
# the test, speaking the chat-completions dialect, not against a mock library.
axum = { workspace = true }
# The test tool that proves a statement is recorded even when its read fails
# declares a `clickhouse::Row` for the one column it asks for.
clickhouse = { workspace = true }
