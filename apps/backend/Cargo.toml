[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/micaforge/micaforge"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.dependencies]
# HTTP
axum = { version = "0.8", features = ["macros", "json", "query"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit", "catch-panic", "set-header"] }
http = "1"

# Runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Storage
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "bigdecimal"] }
clickhouse = { version = "0.13", features = ["rustls-tls", "uuid", "chrono"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "script"] }

# Crypto / auth
argon2 = "0.5"
chacha20poly1305 = "0.10"
blake3 = "1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.9"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = "9"
totp-rs = { version = "5", features = ["gen_secret"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }

# Parsing / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
csv = "1"
url = "2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v7", "v4", "serde"] }
ipnet = { version = "2", features = ["serde"] }
maxminddb = "0.26"
woothee = "0.13"
publicsuffix = "2"
flate2 = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors / misc
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
validator = { version = "0.20", features = ["derive"] }
cron = "0.15"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# internal
micaforge-core = { path = "crates/core" }
micaforge-store = { path = "crates/store" }
micaforge-agents = { path = "crates/agents" }
micaforge-enrich = { path = "crates/enrich" }
micaforge-query = { path = "crates/query" }
micaforge-jobs = { path = "crates/jobs" }
micaforge-mail = { path = "crates/mail" }
